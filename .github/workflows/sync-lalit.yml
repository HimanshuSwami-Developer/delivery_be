name: Sync to Lalit Repository

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Lalit repository
        env:
          TOKEN: ${{ secrets.LALIT_GITHUB_TOKEN }}
        run: |
          git config user.name "HimanshuSwami-Developer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add lalit https://x-access-token:${TOKEN}@github.com/lalittradingcompany89-Developer/delivery_be.git

          git push lalit main:main
